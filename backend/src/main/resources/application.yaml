spring:
  application:
    name: eventhub-java

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/eventhub}
    username: ${DB_USERNAME:eventhub}
    password: ${DB_PASSWORD:eventhub_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
